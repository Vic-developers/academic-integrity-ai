name: academic-integrity-ai
x-backend: &backend
  image: academic-integrity-ai-backend:dev
  build: ./backend
  environment: &environment
    DATABASE_URL: postgresql+psycopg://aid_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/academic_integrity
    REDIS_URL: redis://redis:6379/0
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
    ENVIRONMENT: development
    SECURE_COOKIES: "false"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  volumes:
    - documents:/var/lib/academic-integrity/documents
  restart: unless-stopped
services:
  db:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_USER: aid_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: academic_integrity
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aid_owner -d academic_integrity"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2-alpine@sha256:489a769e0a54dc245896132a15c72d2bc7296719954da99398f43a3877e5f8eb
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: academic-integrity-ai-backend:dev
    build: ./backend
    environment:
      <<: *environment
      DATABASE_URL: postgresql+psycopg://aid_owner:${POSTGRES_PASSWORD}@db:5432/academic_integrity
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips=*, --no-access-log]
  worker:
    <<: *backend
    command: [celery, -A, app.worker.celery, worker, --beat, --schedule=/tmp/celerybeat-schedule, --concurrency=1, --loglevel=WARNING]
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ["127.0.0.1:8025:8025"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:8080"]
    depends_on: [api]
volumes:
  documents:
  database:
