server {
  listen 8080;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    client_max_body_size 64m;
    set $api_backend http://api:8000;
    proxy_pass $api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location ~ \.mjs$ { default_type application/javascript; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
